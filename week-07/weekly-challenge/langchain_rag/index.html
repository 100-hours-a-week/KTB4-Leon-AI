<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>한국어 문장 도구</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f4f6f8;
      --panel: #ffffff;
      --ink: #1c252c;
      --muted: #66737d;
      --line: #d8dee3;
      --accent: #087f5b;
      --accent-strong: #06684a;
      --soft: #eaf7f2;
      --warm: #fff6e6;
      --warm-line: #f2c879;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg);
      color: var(--ink);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    main { width: min(1040px, calc(100% - 32px)); margin: 36px auto; }
    header {
      display: flex;
      align-items: end;
      justify-content: space-between;
      gap: 20px;
      margin-bottom: 18px;
    }
    h1 { margin: 0; font-size: 28px; letter-spacing: 0; }
    .status { color: var(--muted); font-size: 13px; }
    .tabs {
      display: inline-grid;
      grid-template-columns: 1fr 1fr;
      gap: 4px;
      padding: 4px;
      margin-bottom: 12px;
      border: 1px solid var(--line);
      border-radius: 7px;
      background: #e9edf0;
    }
    .tab {
      min-width: 150px;
      border: 0;
      border-radius: 5px;
      padding: 9px 14px;
      background: transparent;
      color: var(--muted);
      font: inherit;
      font-weight: 700;
      cursor: pointer;
    }
    .tab[aria-selected="true"] {
      background: var(--panel);
      color: var(--ink);
      box-shadow: 0 1px 2px rgb(15 23 42 / 12%);
    }
    .workspace {
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--panel);
      overflow: hidden;
    }
    .panel { padding: 26px; }
    .panel[hidden] { display: none; }
    label { display: block; margin-bottom: 8px; font-weight: 700; }
    textarea {
      width: 100%;
      min-height: 116px;
      padding: 14px;
      resize: vertical;
      border: 1px solid var(--line);
      border-radius: 6px;
      color: var(--ink);
      font: inherit;
      font-size: 17px;
      line-height: 1.65;
    }
    textarea:focus, input:focus {
      outline: 3px solid var(--soft);
      border-color: var(--accent);
    }
    .toolbar {
      display: flex;
      align-items: end;
      justify-content: space-between;
      gap: 16px;
      margin-top: 14px;
    }
    .settings { display: flex; gap: 12px; }
    .setting { margin: 0; color: var(--muted); font-size: 13px; }
    input[type="number"] {
      display: block;
      width: 92px;
      height: 38px;
      margin-top: 5px;
      padding: 7px 9px;
      border: 1px solid var(--line);
      border-radius: 6px;
      color: var(--ink);
      font: inherit;
    }
    .actions { display: flex; gap: 8px; }
    .action {
      height: 40px;
      border: 1px solid var(--accent);
      border-radius: 6px;
      padding: 0 15px;
      background: var(--accent);
      color: white;
      font: inherit;
      font-weight: 700;
      cursor: pointer;
    }
    .action:hover { background: var(--accent-strong); }
    .action.secondary { background: white; color: var(--accent); }
    .action:disabled { opacity: .55; cursor: wait; }
    .result-section { margin-top: 24px; padding-top: 20px; border-top: 1px solid var(--line); }
    .section-label { margin-bottom: 10px; color: var(--muted); font-size: 13px; font-weight: 700; }
    .candidates { display: flex; min-height: 42px; flex-wrap: wrap; gap: 8px; }
    .candidate {
      min-height: 38px;
      border: 1px solid var(--line);
      border-radius: 6px;
      padding: 7px 11px;
      background: white;
      color: var(--ink);
      font: inherit;
      font-weight: 700;
      cursor: pointer;
    }
    .candidate:hover { border-color: var(--accent); background: var(--soft); }
    .candidate small { margin-left: 7px; color: var(--muted); font-weight: 500; }
    .completion, .answer {
      min-height: 78px;
      padding: 15px 16px;
      border-left: 4px solid var(--accent);
      background: var(--soft);
      line-height: 1.7;
      white-space: pre-wrap;
    }
    .completion { margin-top: 16px; }
    .rag-layout { display: grid; grid-template-columns: minmax(0, 1fr) 280px; }
    .rag-main { padding: 26px; border-right: 1px solid var(--line); }
    aside { padding: 22px; background: #fafbfc; }
    .answer { margin-top: 20px; }
    .trace { margin-top: 10px; color: var(--muted); font-size: 12px; overflow-wrap: anywhere; }
    .source { padding: 10px 0; border-bottom: 1px solid var(--line); font-size: 13px; }
    .source strong { display: block; margin-bottom: 4px; }
    .empty { color: var(--muted); line-height: 1.6; }
    @media (max-width: 720px) {
      main { margin: 24px auto; }
      header { align-items: start; flex-direction: column; }
      .tabs { display: grid; width: 100%; }
      .tab { min-width: 0; }
      .toolbar { align-items: stretch; flex-direction: column; }
      .actions { display: grid; grid-template-columns: 1fr 1fr; }
      .rag-layout { grid-template-columns: 1fr; }
      .rag-main { border-right: 0; border-bottom: 1px solid var(--line); }
    }
  </style>
</head>
<body>
  <main>
    <header>
      <h1>한국어 문장 도구</h1>
      <div id="status" class="status">모델 확인 중</div>
    </header>

    <div class="tabs" role="tablist" aria-label="기능 선택">
      <button class="tab" type="button" role="tab" data-mode="autocomplete" aria-selected="true">다음 단어 예측</button>
      <button class="tab" type="button" role="tab" data-mode="rag" aria-selected="false">문서 질의응답</button>
    </div>

    <div class="workspace">
      <section id="autocomplete-panel" class="panel" role="tabpanel">
        <form id="autocomplete-form">
          <label for="prompt">입력 중인 문장</label>
          <textarea id="prompt" required>오늘 오전</textarea>
          <div class="toolbar">
            <div class="settings">
              <label class="setting" for="top-k">후보 개수
                <input id="top-k" type="number" min="1" max="20" value="5">
              </label>
              <label class="setting" for="word-count">이어쓰기 단어 수
                <input id="word-count" type="number" min="1" max="30" value="8">
              </label>
            </div>
            <div class="actions">
              <button id="predict" class="action" type="submit">다음 단어 예측</button>
              <button id="continue" class="action secondary" type="button">문장 이어쓰기</button>
            </div>
          </div>
        </form>
        <div class="result-section">
          <div id="candidate-label" class="section-label">다음 단어 후보</div>
          <div id="candidates" class="candidates empty">예측할 문장을 입력하세요.</div>
          <div id="completion" class="completion empty">이어쓰기 결과</div>
        </div>
      </section>

      <section id="rag-panel" role="tabpanel" hidden>
        <div class="rag-layout">
          <div class="rag-main">
            <form id="rag-form">
              <label for="question">문서 질문</label>
              <textarea id="question" required>문서를 추가하고 재인덱싱하려면 어떻게 하나요?</textarea>
              <button id="rag-submit" class="action" type="submit">문서 검색</button>
            </form>
            <div id="answer" class="answer empty">답변 결과</div>
            <div id="trace" class="trace"></div>
          </div>
          <aside>
            <div class="section-label">검색 근거</div>
            <div id="sources" class="empty">검색 결과</div>
          </aside>
        </div>
      </section>
    </div>
  </main>

  <script>
    const status = document.querySelector("#status");
    const tabs = document.querySelectorAll(".tab");
    const autocompletePanel = document.querySelector("#autocomplete-panel");
    const ragPanel = document.querySelector("#rag-panel");
    const promptBox = document.querySelector("#prompt");
    const candidates = document.querySelector("#candidates");
    const completion = document.querySelector("#completion");
    const predictButton = document.querySelector("#predict");
    const continueButton = document.querySelector("#continue");
    let predictTimer;
    let predictionSequence = 0;

    function setMode(mode) {
      tabs.forEach(tab => tab.setAttribute("aria-selected", String(tab.dataset.mode === mode)));
      autocompletePanel.hidden = mode !== "autocomplete";
      ragPanel.hidden = mode !== "rag";
    }

    tabs.forEach(tab => tab.addEventListener("click", () => setMode(tab.dataset.mode)));

    fetch("/health")
      .then(response => response.json())
      .then(data => {
        status.textContent = `${data.autocomplete_model} 자동완성 · ${data.primary_model} RAG`;
      })
      .catch(() => { status.textContent = "모델 상태 확인 실패"; });

    function appendWord(word) {
      const current = promptBox.value.trimEnd();
      promptBox.value = current ? `${current} ${word}` : word;
      promptBox.focus();
      predictNextWord();
    }

    async function predictNextWord() {
      const prompt = promptBox.value.trim();
      if (!prompt) {
        candidates.className = "candidates empty";
        candidates.textContent = "예측할 문장을 입력하세요.";
        return;
      }
      predictButton.disabled = true;
      candidates.className = "candidates empty";
      candidates.textContent = "예측 중...";
      const requestId = ++predictionSequence;
      try {
        const response = await fetch("/api/next-word", {
          method: "POST",
          headers: {"Content-Type": "application/json"},
          body: JSON.stringify({prompt, top_k: Number(document.querySelector("#top-k").value)})
        });
        const data = await response.json();
        if (!response.ok) throw new Error(data.detail || "예측 실패");
        if (requestId !== predictionSequence) return;
        document.querySelector("#candidate-label").textContent =
          `다음 단어 후보 · ${data.provider === "gemini" ? "Gemini" : "로컬 fallback"}`;
        candidates.textContent = "";
        candidates.className = data.candidates.length ? "candidates" : "candidates empty";
        if (!data.candidates.length) {
          candidates.textContent = "후보를 찾지 못했습니다.";
          return;
        }
        data.candidates.forEach(item => {
          const button = document.createElement("button");
          const rank = document.createElement("small");
          button.type = "button";
          button.className = "candidate";
          button.append(document.createTextNode(item.word));
          rank.textContent = `${item.rank}순위`;
          button.append(rank);
          button.addEventListener("click", () => appendWord(item.word));
          candidates.append(button);
        });
      } catch (error) {
        if (requestId !== predictionSequence) return;
        candidates.className = "candidates empty";
        candidates.textContent = error.message;
      } finally {
        if (requestId === predictionSequence) predictButton.disabled = false;
      }
    }

    document.querySelector("#autocomplete-form").addEventListener("submit", event => {
      event.preventDefault();
      predictNextWord();
    });

    promptBox.addEventListener("input", () => {
      window.clearTimeout(predictTimer);
      predictTimer = window.setTimeout(predictNextWord, 650);
    });

    continueButton.addEventListener("click", async () => {
      const prompt = promptBox.value.trim();
      if (!prompt) return;
      continueButton.disabled = true;
      completion.className = "completion empty";
      completion.textContent = "이어쓰는 중...";
      try {
        const response = await fetch("/api/generate", {
          method: "POST",
          headers: {"Content-Type": "application/json"},
          body: JSON.stringify({
            prompt,
            max_new_tokens: Number(document.querySelector("#word-count").value),
            top_k: Number(document.querySelector("#top-k").value)
          })
        });
        const data = await response.json();
        if (!response.ok) throw new Error(data.detail || "이어쓰기 실패");
        completion.className = "completion";
        completion.textContent = data.generated_text;
      } catch (error) {
        completion.className = "completion empty";
        completion.textContent = error.message;
      } finally {
        continueButton.disabled = false;
      }
    });

    const ragButton = document.querySelector("#rag-submit");
    const answer = document.querySelector("#answer");
    const sources = document.querySelector("#sources");
    const trace = document.querySelector("#trace");

    document.querySelector("#rag-form").addEventListener("submit", async event => {
      event.preventDefault();
      ragButton.disabled = true;
      answer.className = "answer empty";
      answer.textContent = "검색 및 생성 중...";
      sources.className = "empty";
      sources.textContent = "검색 중...";
      trace.textContent = "";
      try {
        const response = await fetch("/api/query", {
          method: "POST",
          headers: {"Content-Type": "application/json"},
          body: JSON.stringify({question: document.querySelector("#question").value, top_k: 4})
        });
        const data = await response.json();
        if (!response.ok) throw new Error(data.detail || "질의 실패");
        answer.className = "answer";
        answer.textContent = data.answer;
        trace.textContent = `${data.provider} · ${data.model} · Chain run ID: ${data.trace_id}`;
        sources.className = "";
        sources.textContent = "";
        data.sources.forEach(item => {
          const row = document.createElement("div");
          const title = document.createElement("strong");
          const score = document.createElement("span");
          row.className = "source";
          title.textContent = item.source;
          score.textContent = `유사도 ${item.score.toFixed(3)}`;
          row.append(title, score);
          sources.append(row);
        });
      } catch (error) {
        answer.className = "answer empty";
        answer.textContent = error.message;
        sources.className = "empty";
        sources.textContent = "검색 근거를 불러오지 못했습니다.";
      } finally {
        ragButton.disabled = false;
      }
    });

    predictNextWord();
  </script>
</body>
</html>
