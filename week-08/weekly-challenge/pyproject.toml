[project]
name = "week08-langgraph-rag-agent"
version = "0.1.0"
description = "Week 8 LangGraph RAG agent FastAPI project."
requires-python = ">=3.10"
dependencies = [
    "anthropic>=0.69,<1",
    "fastapi>=0.110,<1",
    "google-genai>=1.0,<2",
    "httpx>=0.27,<1",
    "langchain-core>=1.0,<2",
    "langchain-text-splitters>=1.0,<2",
    "langgraph>=1.0,<2",
    "pydantic>=2.7,<3",
    "pytest>=8,<9",
    "python-dotenv>=1.0,<2",
    "scikit-learn>=1.4,<2",
    "uvicorn[standard]>=0.27,<1",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
